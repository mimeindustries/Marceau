name=Marceau
version=1.0.1
author=Mime Industries <info@mime.co.uk>
maintainer=Ben Gray <ben.gray@mime.co.uk>
sentence=This is a library that allows devices to be easily controlled over serial and websockets.
paragraph=Marceau is a library you can use to enable devices to be easily controlled over serial and websockets. It sets up a simple JSON based command interpreter and allows functions to run on the device, providing asynchronous updates to clients.
category=Other
url=https://github.com/mimeindustries/Marceau
architectures=esp32,esp8266
depends=ESP Async WebServer (>=3.6.0), Async TCP (>=3.3.2), ESP Async TCP (>=2.0.0)
